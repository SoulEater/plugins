name: Validate Plugin TOML

on:
  pull_request:
    branches:
      - master
    paths:
      - 'plugins/**'
      - 'constants.ts'
      - 'validate.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/validate-plugin-toml.yml'

permissions:
  contents: read

concurrency:
  group: validate-plugin-toml-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Get changed plugins
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED_PLUGINS=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | awk -F/ '/^plugins\// && NF >= 2 { print $2 }' | sort -u | tr '\n' ' ')
          CHANGED_PLUGIN_COUNT=$(printf '%s' "$CHANGED_PLUGINS" | wc -w)
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED_PLUGIN_COUNT" -eq 0 ]; then
            echo "No plugins changed; validating all plugins"
          fi
          echo "plugins=$CHANGED_PLUGINS" >> "$GITHUB_OUTPUT"
          echo "Changed plugin count: $CHANGED_PLUGIN_COUNT"

      - name: Setup Node.js
        if: steps.changed.outputs.has_changes == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup pnpm
        if: steps.changed.outputs.has_changes == 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Install dependencies
        if: steps.changed.outputs.has_changes == 'true'
        run: pnpm install --frozen-lockfile

      - name: Validate plugin.toml files
        id: validate
        if: steps.changed.outputs.has_changes == 'true'
        continue-on-error: true
        env:
          VALIDATION_REPORT_PATH: validation-report.md
        run: |
          pnpm validate ${{ steps.changed.outputs.plugins }}
          echo "result=success" >> $GITHUB_OUTPUT

      - name: Prepare fallback report
        if: always() && steps.changed.outputs.has_changes == 'true'
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          if [ -f validation-report.md ]; then
            exit 0
          fi

          if [ "$VALIDATE_OUTCOME" = "failure" ]; then
            printf '%s\n' \
              '## Plugin TOML Validation Report' \
              '' \
              '**Status**: ❌ Validation stopped before a report could be generated' \
              '' \
              'Review the validation step logs for the error' > validation-report.md
          else
            printf '%s\n' \
              '## Plugin TOML Validation Report' \
              '' \
              '**Status**: ✅ Validation completed' > validation-report.md
          fi

      - name: Upload validation report
        if: always() && steps.changed.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: plugin-toml-validation
          path: validation-report.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1
